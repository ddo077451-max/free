{% extends "base.html" %}
{% block title %}Вход — Конференции.РФ{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Вход</h1>
  {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Логин
      <input type="text" name="login" data-testid="login-login" required>
    </label>
    <label>Пароль
      <input type="password" name="password" data-testid="login-password" required>
    </label>
    <button type="submit" class="btn" data-testid="login-submit">Войти</button>
  </form>
  <p class="switch-link"><a href="{{ url_for('register') }}">Еще не зарегистрированы? Регистрация</a></p>
</section>
{% endblock %}
